server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://whoami:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /stub_status {
        stub_status;
        access_log off;
        allow 172.18.0.4;   # docker-сети
        allow 10.0.0.0/8;
        deny all;
    }
}
